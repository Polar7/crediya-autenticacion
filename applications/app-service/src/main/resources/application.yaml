server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: "authentication-microservice"
  devtools:
    add-properties: false
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200, ${APPLICATIONS_SERVICE_URL}"

adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    schema: ${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

routes:
  paths:
    users: "/api/v1/usuarios"
    usersByEmails: "/api/v1/usuarios/emails"
    userByDocument: "/api/v1/usuarios/{docNumber}"
    auth: "/api/v1/autenticacion"

jwt:
  token:
    secret-key: ${JWT_SECRET}
    expire-length: ${JWT_EXPIRE}
