server:
  port: 8080
spring:
  application:
    name: "authentication-microservice"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8090"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "pragma_autenticacion"
    schema: "public"
    username: "postgres"
    password: "postgres"

routes:
  paths:
    users: "/api/v1/usuarios"
    usersByEmails: "/api/v1/usuarios/emails"
    userByDocument: "/api/v1/usuarios/{docNumber}"
    auth: "/api/v1/autenticacion"

jwt:
  token:
    secret-key: mi_clave_super_segura_1234567890!@#
    expire-length: 86400000
